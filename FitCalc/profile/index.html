<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="Profile - FitCalc">
<meta property="og:description" content="">
<meta property="og:type" content="website">
<title>Profile - FitCalc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../main.css">
</head>
<body>
<div class="scanlines" aria-hidden="true"></div>
<div class="ambient ambient-a" aria-hidden="true"></div>
<div class="ambient ambient-b" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="../" aria-label="FitCalc home">
    <span class="brand-mark">+</span>
    <span class="brand-name">fitcalc</span>
    <span class="brand-cursor">_</span>
  </a>
  <nav class="desktop-nav" aria-label="Main navigation">
    <a href="../">Home</a>
    <a href="../nutrition/">Nutrition</a>
    <a href="../#calculators">Tools ↗</a>
    <a href="../history/">History</a>
  </nav>
  <div class="topbar-right">
    <span class="ws-clock"><span class="dot"></span><span id="ws-clock-time">00:00:00</span></span>
    <button class="menu-toggle" id="hamburger-btn" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="mobile-menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<div class="mobile-menu" id="mobile-menu">
  <a href="../">Home</a>
  <a href="../nutrition/">Nutrition</a>
  <a href="../history/">History</a>
  <a href="../planner/">Planner</a>
</div>
<main>
    <section class="profile shell">
        <div class="calc-crumb">
            <a href="../">fitcalc</a>
            <span>/</span>
            <span>profile</span>
            <span class="ws-tag">workspace 01</span>
        </div>

        <div class="calc-window window">
            <div class="window-titlebar">
                <span class="tl-dots"><i></i><i></i><i></i></span>
                <span class="window-title">profile.cfg</span>
                <span class="window-meta">ws01</span>
            </div>

            <div class="calc-tiles">
                <div class="tile tile-input">
                    <h1>Your Profile</h1>
                    <p class="calc-desc">
                        Set up your personal fitness information.
                    </p>

                    <form id="profile-form">

                        <div class="field">
                            <label for="profile-age">Age</label>
                            <input
                                type="number"
                                id="profile-age"
                                min="1"
                                max="120"
                                required
                            >
                        </div>

                        <div class="field">
                            <label for="profile-sex">Sex</label>
                            <select id="profile-sex" required>
                                <option value="">Select</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="profile-height">Height (cm)</label>
                            <input
                                type="number"
                                id="profile-height"
                                min="50"
                                max="250"
                                required
                            >
                        </div>

                        <div class="field">
                            <label for="profile-weight">Weight (kg)</label>
                            <input
                                type="number"
                                id="profile-weight"
                                min="20"
                                max="500"
                                step="0.1"
                                required
                            >
                        </div>

                        <div class="field">
                            <label for="profile-activity">Activity Level</label>
                            <select id="profile-activity" required>
                                <option value="">Select</option>
                                <option value="sedentary">Sedentary</option>
                                <option value="light">Lightly Active</option>
                                <option value="moderate">Moderately Active</option>
                                <option value="active">Active</option>
                                <option value="very_active">Very Active</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="profile-goal">Goal</label>
                            <select id="profile-goal" required>
                                <option value="">Select</option>
                                <option value="lose">Lose Weight</option>
                                <option value="maintain">Maintain Weight</option>
                                <option value="gain">Gain Weight</option>
                            </select>
                        </div>

                        <button type="submit" class="primary-btn">
                            Save Profile
                        </button>

                    </form>
                </div>
            </div>
        </div>
    </section>
</main>
<script src="../constants.js"></script>
<script src="../script.js"></script>
<script src="../profile.js"></script>
<script src="../target.js"></script>
</body>
</html>
